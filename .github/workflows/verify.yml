name: verify-reproducibility-bundle

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify notebooks and frozen artifacts
        run: python scripts/verify_bundle.py
